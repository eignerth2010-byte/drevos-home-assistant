[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "drevos-gateway"
version = "0.1.0"
description = "Local serial gateway for the verified Drevos FX3U smoker profile"
requires-python = ">=3.11"
dependencies = ["pyserial>=3.5,<4"]
license = "MIT"

[project.scripts]
drevos-gateway = "drevos_gateway.server:main"

[tool.setuptools.packages.find]
include = ["drevos_gateway*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_default_fixture_loop_scope = "function"

[tool.ruff]
target-version = "py311"
line-length = 100
